name: Android CI

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/github-actions-demo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build All Variants
        run: ./gradlew assemble

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifacts
          path: projects/github-actions-demo/app/build/outputs/apk/**/*.apk